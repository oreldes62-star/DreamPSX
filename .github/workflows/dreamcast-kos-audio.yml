name: Dreamcast KallistiOS audio smoke build

on:
  push:
    branches: [main]
    paths:
      - "platform/dreamcast/**"
      - "src/audio/**"
      - "src/bus/**"
      - "src/platform/dreamcast/**"
      - "src/media/**"
      - "include/dreampsx/**"
      - ".github/workflows/dreamcast-kos-audio.yml"
  pull_request:
    branches: [main]
    paths:
      - "platform/dreamcast/**"
      - "src/audio/**"
      - "src/platform/dreamcast/**"
      - "include/dreampsx/**"
      - ".github/workflows/dreamcast-kos-audio.yml"
  workflow_dispatch:

jobs:
  build-audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out DreamPSX
        uses: actions/checkout@v4

      - name: Check out pinned KallistiOS source
        uses: actions/checkout@v4
        with:
          repository: KallistiOS/KallistiOS
          ref: 9926b70aeafc8398675caef98813f10d15d8a329
          path: kos

      - name: Pull official KallistiOS toolchain image
        run: docker pull pcercuei/dreamcast-toolchain:stable

      - name: Build KallistiOS for Dreamcast
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/kos:/workspace" \
            -w /workspace \
            pcercuei/dreamcast-toolchain:stable \
            sh .github/build-kos.sh dreamcast

      - name: Build DreamPSX AICA audio smoke-test ELF
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/kos:/workspace" \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/platform/dreamcast/audio-smoke \
            pcercuei/dreamcast-toolchain:stable \
            sh -lc '. /workspace/environ.sh && make clean && make'

      - name: Verify Dreamcast executable
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/kos:/workspace" \
            -v "$GITHUB_WORKSPACE:/project" \
            -w /project/platform/dreamcast/audio-smoke \
            pcercuei/dreamcast-toolchain:stable \
            sh -lc '. /workspace/environ.sh && sh-elf-readelf -h dreampsx-audio-smoke.elf && sh-elf-readelf -h dreampsx-boot-smoke.elf && test "$(sh-elf-ar t libdreampsx_core.a | wc -l)" -eq 27'

      - name: Build mkdcdisc image packager
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ git libisofs-dev meson ninja-build pkg-config
          git clone --depth 1 https://gitlab.com/simulant/mkdcdisc.git "$RUNNER_TEMP/mkdcdisc"
          meson setup "$RUNNER_TEMP/mkdcdisc/build" "$RUNNER_TEMP/mkdcdisc"
          meson compile -C "$RUNNER_TEMP/mkdcdisc/build"
          echo "$RUNNER_TEMP/mkdcdisc/build" >> "$GITHUB_PATH"

      - name: Build self-booting CDI diagnostic image
        run: |
          sh platform/dreamcast/audio-smoke/package-cdi.sh

      - name: Upload DreamPSX CDI
        uses: actions/upload-artifact@v4
        with:
          name: dreampsx-flycast-cdi
          path: platform/dreamcast/audio-smoke/cdi-output/dreampsx-audio-smoke.cdi
          if-no-files-found: error

      - name: Upload Dreamcast ELF
        uses: actions/upload-artifact@v4
        with:
          name: dreampsx-dreamcast-build
          path: |
            platform/dreamcast/audio-smoke/dreampsx-audio-smoke.elf
            platform/dreamcast/audio-smoke/dreampsx-boot-smoke.elf
            platform/dreamcast/audio-smoke/libdreampsx_core.a
          if-no-files-found: error
