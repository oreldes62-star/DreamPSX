name: DreamPSX host regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out DreamPSX
        uses: actions/checkout@v4

      - name: Configure with strict warnings
        run: cmake -S . -B build -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build all host targets
        run: cmake --build build --parallel 2

      - name: Run complete regression suite
        run: ctest --test-dir build --output-on-failure
